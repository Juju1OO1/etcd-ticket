services:
  postgres:
    image: postgres:16
    container_name: etcd-ticket-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: etcd_ticket
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: etcd-ticket-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
