server:
  port: 8080

etcd:
  endpoints:
    - "localhost:2379"   # etcd1
    - "localhost:2381"   # etcd2
    - "localhost:2382"   # etcd3
  dial_timeout: 5

database:
  dsn: "postgres://postgres:password@localhost:5433/etcd_ticket"

redis:
  addr: "localhost:6379"

rate_limit:
  rps: 1000    # per-IP 每秒允許速率（測試用寬鬆值，demo 前再調回合理範圍）
  burst: 2000  # per-IP token bucket 容量
